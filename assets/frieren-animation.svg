  <style>
    :root {
      --path-color: #24292f;      /* Dark Charcoal for Light Mode */
      --bg-color: transparent;    /* Transparent background */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --path-color: #f0f6fc;    /* White / Light Gray for Dark Mode */
        --bg-color: transparent;
      }
    }

    .animated-path {
      stroke: var(--path-color);
      fill: var(--path-color);
      stroke-width: 5px;
      fill-opacity: 0;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: 
        drawPath 3.7s ease-in-out forwards,
        fillFade 1s linear 3.7s forwards;
    }

    @keyframes drawPath {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes fillFade {
      from { fill-opacity: 0; }
      to { fill-opacity: 1; }
    }
  </style>

