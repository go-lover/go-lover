<svg width="450" height="100" viewBox="0 0 450 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg-start: #FFFFFF;
        --bg-end: #E6EAEF;
        --grid-color: #C9D0D8;
        --text-usr: #0969DA;
        --text-op: #1F2328;
        --text-str: #116329;
        --tab-text: #57606A;
        --accent-color: #00ADD8;
        --border-color: #D0D7DE; 
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-start: #0D1117;
          --bg-end: #040507;
          --grid-color: #333333;
          --text-usr: #428EEE;
          --text-op: #F0F6FC;
          --text-str: #56D364;
          --tab-text: #666666;
          --accent-color: #00ADD8;
          --border-color: #30363D; 
        }
      }

      .bg-gradient-start { stop-color: var(--bg-start); }
      .bg-gradient-end   { stop-color: var(--bg-end); }
      .box-bg            { fill: url(#bgGradient); }
      .grid-path         { stroke: var(--grid-color); }
      .accent-bar        { fill: var(--accent-color); }
      .txt-usr           { fill: var(--text-usr); }
      .txt-op            { fill: var(--text-op); }
      .txt-str           { fill: var(--text-str); }
      .txt-tab           { fill: var(--tab-text); }
      .border-stroke     { stroke: var(--border-color); }
    </style>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="bg-gradient-start" stop-opacity="1" />
      <stop offset="100%" class="bg-gradient-end" stop-opacity="1" />
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-path" stroke-width="0.5"/>
    </pattern>

    <rect id="card-shape" x="2" y="2" width="446" height="96" rx="6" />
    
    <clipPath id="card-clip">
      <use href="#card-shape" />
    </clipPath>
  </defs>

  <use href="#card-shape" class="box-bg" />

  <g clip-path="url(#card-clip)">
    
    <rect x="2" y="2" width="446" height="96" fill="url(#grid)" opacity="0.4"/>
    
    <rect x="0" y="0" width="10" height="100" class="accent-bar"/>
    
  </g>

  <use href="#card-shape" fill="none" class="border-stroke" stroke-width="2"/>

  <g transform="translate(30, 60)" font-family="Consolas, 'Courier New', monospace" font-size="28">
    <text x="0" y="0" class="txt-usr" font-weight="bold">usr</text>
    <text x="55" y="0" class="txt-op" font-weight="bold">:=</text>
    <text x="100" y="0" class="txt-str">"@go-lover"</text>
  </g>

  <text x="30" y="25" font-family="Arial, sans-serif" font-size="10" class="txt-tab" font-weight="bold" letter-spacing="1">
    MAIN.GO
  </text>

</svg>
