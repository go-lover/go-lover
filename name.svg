<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Golang Blue Gradient -->
    <linearGradient id="goGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ADD8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007d9c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Pill Shape -->
  <rect x="10" y="20" width="380" height="80" rx="40" fill="#202020" filter="url(#shadow)" stroke="#00ADD8" stroke-width="2"/>

  <!-- The "Gopher" Icon (Stylized Construction) -->
  <g transform="translate(45, 60)">
    <!-- Ears -->
    <ellipse cx="-18" cy="-15" rx="8" ry="8" fill="#00ADD8" />
    <ellipse cx="18" cy="-15" rx="8" ry="8" fill="#00ADD8" />
    
    <!-- Head Body -->
    <path d="M-22,0 Q-22,-25 0,-25 Q22,-25 22,0 L22,20 L-22,20 Z" fill="#00ADD8"/>
    
    <!-- Eyes (The distinct Go look) -->
    <circle cx="-8" cy="-5" r="7" fill="white"/>
    <circle cx="8" cy="-5" r="7" fill="white"/>
    <circle cx="-6" cy="-5" r="2.5" fill="black"/>
    <circle cx="6" cy="-5" r="2.5" fill="black"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="2" rx="3" ry="2" fill="black" opacity="0.6"/>
    
    <!-- Tooth -->
    <rect x="-3" y="6" width="6" height="6" rx="1" fill="white"/>
  </g>

  <!-- Separator Line -->
  <line x1="90" y1="35" x2="90" y2="85" stroke="#555" stroke-width="2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="110" y="68" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="34" fill="white" letter-spacing="-1">
    @go-lover
  </text>
  
  <!-- Syntax Highlight Dot (Like a generic type parameter) -->
  <text x="330" y="68" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#00ADD8">
    {}
  </text>

</svg>
