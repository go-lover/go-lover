<svg width="450" height="100" viewBox="0 0 450 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- IDE Dark Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#040507;stop-opacity:1" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#333" stroke-width="0.5"/>
    </pattern>

    <!-- Cursor Blink Animation -->
    <style>
      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="446" height="96" rx="6" fill="url(#bgGradient)" stroke="#3e3e42" stroke-width="1"/>
  
  <!-- Grid Overlay -->
  <rect x="4" y="4" width="442" height="92" rx="4" fill="url(#grid)" opacity="0.4"/>

  <!-- Left Accent Bar (Golang Cyan) -->
  <rect x="2" y="2" width="6" height="96" rx="2" fill="#00ADD8"/>

  <!-- Code Snippet Group -->
  <g transform="translate(30, 60)" font-family="Consolas, 'Courier New', monospace" font-size="28">
    
    <!-- Variable Name -->
    <text x="0" y="0" fill="#428EEE" font-weight="bold">usr</text>
    
    <!-- Walrus Operator (The essence of Go) -->
    <text x="55" y="0" fill="#F0F6FC" font-weight="bold">:=</text>
    
    <!-- String Value -->
    <text x="100" y="0" fill="#56D364">"@go-lover"</text>
    
    <!-- The Cursor Block -->
    <rect x="285" y="-22" width="12" height="28" fill="#00ADD8" class="cursor"/>
  </g>

  <!-- Top "File Tab" Text -->
  <text x="30" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666" font-weight="bold" letter-spacing="1">
    MAIN.GO
  </text>

</svg>
